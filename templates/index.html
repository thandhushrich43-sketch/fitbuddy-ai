<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitBuddy - AI Workout Generator</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="/" class="brand">
      🏋️‍♂️ Fit<span>Buddy</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link active">Home</a>
      <a href="/view-all-users" class="nav-link">Admin Dashboard</a>
      <a href="/docs" target="_blank" class="nav-link">API Docs</a>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="page-container">
    <div class="glass-card">
      <h1 class="card-title">FitBuddy - AI Workout Generator</h1>
      <p class="card-subtitle">Generate a custom 7-day fitness routine and nutrition advice powered by Google Gemini AI.</p>

      <form action="/generate-workout" method="POST" id="workout-form">
        <!-- Name Field -->
        <div class="form-group">
          <label for="username" class="form-label">Name:</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="form-input" 
            placeholder="e.g. Alex Hunter" 
            required
          >
        </div>

        <!-- User ID & Age Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="user_id" class="form-label">User ID:</label>
            <input 
              type="number" 
              id="user_id" 
              name="user_id" 
              class="form-input" 
              placeholder="e.g. 101" 
              required
            >
          </div>
          <div class="form-group">
            <label for="age" class="form-label">Age:</label>
            <input 
              type="number" 
              id="age" 
              name="age" 
              class="form-input" 
              placeholder="e.g. 24" 
              min="10" 
              max="120" 
              required
            >
          </div>
        </div>

        <!-- Weight (kg) Field -->
        <div class="form-group">
          <label for="weight" class="form-label">Weight (kg):</label>
          <input 
            type="number" 
            step="0.1" 
            id="weight" 
            name="weight" 
            class="form-input" 
            placeholder="e.g. 70.5" 
            min="20" 
            max="300" 
            required
          >
        </div>

        <!-- Fitness Goal Field -->
        <div class="form-group">
          <label for="goal" class="form-label">Fitness Goal:</label>
          <input 
            type="text" 
            id="goal" 
            name="goal" 
            class="form-input" 
            placeholder="e.g., weight loss, muscle gain, flexibility" 
            required
          >
        </div>

        <!-- Workout Intensity Field -->
        <div class="form-group">
          <label for="intensity" class="form-label">Workout Intensity:</label>
          <select id="intensity" name="intensity" class="form-select" required>
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="generate-btn" class="btn-primary">
          <span>⚡ Generate Plan</span>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>FitBuddy &copy; 2026 • AI Fitness Plan Generator powered by Google Gemini Models</p>
  </footer>

</body>
</html>
